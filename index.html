<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperOS 3 Web by Dirly</title>
    <!-- Menggunakan Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --squircle-radius: 18px; /* Radius ikon khas HyperOS */
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #159957 100%);
            background-size: 300% 300%;
            animation: gradientMove 15s ease infinite;
            overflow: hidden;
            color: white;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Container Smartphone */
        .phone-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 850px;
            background-color: transparent;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        @media (min-width: 450px) {
            .phone-container {
                border-radius: 45px;
                border: 8px solid #111;
                height: 90vh;
            }
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px 25px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
        }

        .status-icons i {
            margin-left: 5px;
        }

        /* Widget Teks Welcome */
        .welcome-widget {
            margin: 20px;
            padding: 25px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            border: 1px solid var(--glass-border);
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            animation: fadeIn 1s ease-out;
        }

        .welcome-widget h1 {
            font-size: 22px;
            line-height: 1.4;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #ffffff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Grid Aplikasi */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 15px;
            padding: 10px 20px;
            flex-grow: 1;
            align-content: start;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .app:active {
            transform: scale(0.9);
        }

        .icon {
            width: 60px;
            height: 60px;
            border-radius: var(--squircle-radius);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            color: white;
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        .app-name {
            font-size: 12px;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            white-space: nowrap;
        }

        /* Warna Ikon HyperOS Style */
        .icon-weather { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .icon-gallery { background: linear-gradient(135deg, #f6d365, #fda085); }
        .icon-settings { background: linear-gradient(135deg, #8baaaa, #ae8b9c); }
        .icon-camera { background: linear-gradient(135deg, #e0c3fc, #8ec5fc); }
        .icon-music { background: linear-gradient(135deg, #ff0844, #ffb199); }
        .icon-notes { background: linear-gradient(135deg, #fccb90, #d57eeb); }
        .icon-theme { background: linear-gradient(135deg, #16a085, #f4d03f); }
        .icon-files { background: linear-gradient(135deg, #5ee7df, #b490ca); }

        /* Dock (Aplikasi Bawah) */
        .dock {
            margin: 15px 20px 25px 20px;
            padding: 15px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 35px;
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .dock .app-name {
            display: none; /* Sembunyikan nama di dock */
        }
        
        .dock .icon {
            box-shadow: none;
        }

        .icon-phone { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .icon-messages { background: linear-gradient(135deg, #00c6fb, #005bea); }
        .icon-browser { background: white; color: #1e3c72; border: 1px solid #ddd; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Status Bar Atas -->
        <div class="status-bar">
            <div id="clock">00:00</div>
            <div class="status-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Widget Teks yang Diminta -->
        <div class="welcome-widget">
            <h1>Welcome to Hyperos 3 web by dirly</h1>
        </div>

        <!-- Grid Aplikasi -->
        <div class="app-grid">
            <div class="app">
                <div class="icon icon-weather"><i class="fa-solid fa-cloud-sun"></i></div>
                <span class="app-name">Cuaca</span>
            </div>
            <div class="app">
                <div class="icon icon-gallery"><i class="fa-solid fa-image"></i></div>
                <span class="app-name">Galeri</span>
            </div>
            <div class="app">
                <div class="icon icon-settings"><i class="fa-solid fa-gear"></i></div>
                <span class="app-name">Setelan</span>
            </div>
            <div class="app">
                <div class="icon icon-camera"><i class="fa-solid fa-camera"></i></div>
                <span class="app-name">Kamera</span>
            </div>
            <div class="app">
                <div class="icon icon-music"><i class="fa-solid fa-music"></i></div>
                <span class="app-name">Musik</span>
            </div>
            <div class="app">
                <div class="icon icon-notes"><i class="fa-solid fa-note-sticky"></i></div>
                <span class="app-name">Catatan</span>
            </div>
            <div class="app">
                <div class="icon icon-theme"><i class="fa-solid fa-paintbrush"></i></div>
                <span class="app-name">Tema</span>
            </div>
            <div class="app">
                <div class="icon icon-files"><i class="fa-solid fa-folder-open"></i></div>
                <span class="app-name">File</span>
            </div>
        </div>

        <!-- Dock Bawah -->
        <div class="dock">
            <div class="app">
                <div class="icon icon-phone"><i class="fa-solid fa-phone"></i></div>
                <span class="app-name">Telepon</span>
            </div>
            <div class="app">
                <div class="icon icon-messages"><i class="fa-solid fa-comment"></i></div>
                <span class="app-name">Pesan</span>
            </div>
            <div class="app">
                <div class="icon icon-browser"><i class="fa-brands fa-chrome"></i></div>
                <span class="app-name">Browser</span>
            </div>
            <div class="app">
                <div class="icon icon-camera"><i class="fa-solid fa-camera"></i></div>
                <span class="app-name">Kamera</span>
            </div>
        </div>
    </div>

    <!-- Script untuk Jam Waktu Nyata -->
    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            
            // Format agar selalu dua digit
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            document.getElementById('clock').textContent = hours + ':' + minutes;
        }

        // Jalankan sekali saat load, lalu update setiap detik
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
